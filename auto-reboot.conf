# /etc/auto-reboot.conf - site defaults for auto-reboot(1)
#
# Sourced by bash, as root. Keep it owned by root, mode 0644, and limited to
# the assignments below; auto-reboot refuses a file that fails those checks.
# Command-line options override every value here.

# Reboot time, HH:MM (00:00-23:59)
MACHINE_REBOOT_TIME=22:00

# Reboot once uptime reaches this many days (positive integer)
MACHINE_UPTIME_MAXDAYS=14

# Restrict reboots to these days; empty means any day.
# Comma-separated: Sun,Mon,... or Sunday,... or 0-6 (0=Sunday); mixed is fine.
MACHINE_ALLOWED_DAYS=

#fin
